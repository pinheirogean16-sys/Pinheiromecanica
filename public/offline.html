<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEHLOX — Modo Desconectado</title>
  <style>
    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      border: 1px solid #27272a;
      background-color: #18181b;
      border-radius: 24px;
      padding: 40px;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f97316, #ea580c);
      box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.4);
    }
    .logo img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
    h1 {
      font-size: 20px;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 0.1em;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    p {
      color: #a1a1aa;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.12em;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      background-color: #431407;
      border: 1px solid #9a3412;
      color: #fb923c;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.2em;
      padding: 8px 16px;
      border-radius: 9999px;
      display: inline-block;
      text-transform: uppercase;
    }
    .btn {
      display: block;
      background-color: #f97316;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 24px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #ea580c;
    }
    .footer {
      margin-top: 32px;
      font-size: 9px;
      color: #52525b;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/vehlox-logo.png" alt="VEHLOX" onerror="this.replaceWith(document.createTextNode('VX'))">
    </div>
    <h1>Conexão Interrompida</h1>
    <p>O sinal no fosso de serviço está oscilando. Os checklist e rascunhos locais permanecem salvos em segurança.</p>
    <div class="badge">Sincronizador Autônomo Ativo</div>
    <a href="/" class="btn">Restabelecer Conexão</a>
  </div>
  <div class="footer">VEHLOX • Sistema de Gestão para Oficinas</div>
</body>
</html>
