<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinheiro Diesel Pro - Modo Desconectado</title>
  <style>
    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      border: 1px solid #27272a;
      background-color: #18181b;
      border-radius: 24px;
      padding: 40px;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon {
      font-size: 48px;
    }
    h1 {
      font-size: 20px;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 0.1em;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    p {
      color: #a1a1aa;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.12em;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      background-color: #1e1b4b;
      border: 1px solid #3730a3;
      color: #818cf8;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.2em;
      padding: 8px 16px;
      border-radius: 9999px;
      display: inline-block;
      text-transform: uppercase;
    }
    .btn {
      display: block;
      background-color: #ea580c;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 24px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #f97316;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>Conexão Interrompida</h1>
    <p>O sinal no fosso de serviço está oscilando. Os checklist e rascunhos locais permanecem salvos em segurança.</p>
    <div class="badge">Sincronizador Autônomo Ativo</div>
    <a href="/" class="btn">Restabelecer Conexão</a>
  </div>
</body>
</html>
