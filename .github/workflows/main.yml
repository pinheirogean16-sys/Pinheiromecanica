name: Build Next.js

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Instalar dependências
      run: npm install

    - name: Build do Next.js
      run: npm run build
      env:
        # Variáveis de ambiente falsas para o build não falhar por falta de config
        DATABASE_URL: "mysql://user:pass@localhost:3306/db"
        JWT_SECRET: "build-secret"
        NEXT_PUBLIC_APP_URL: "https://login.pinheiromecanica.com"

    - name: Criar arquivo Zip
      run: zip -r projeto-pronto.zip . -x "node_modules/*" -x ".git/*"

    - name: Fazer upload do Zip
      uses: actions/upload-artifact@v4
      with:
        name: projeto-compilado
        path: projeto-pronto.zip
        retention-days: 1
